<!doctype html>
<html lang="pt-BR">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>Consulta Link PRO</title>
<script>
  // Aplica o tema escolhido antes de desenhar a página, para não piscar.
  try { const t = localStorage.getItem("tema"); if (t) document.documentElement.dataset.tema = t; } catch (e) {}
</script>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link href="https://fonts.googleapis.com/css2?family=Poppins:wght@400;500;600&display=swap" rel="stylesheet">
<style>
  :root {
    --topo: #d9540f; --destaque: #fb8a3c; --laranja: #e8650f; --laranja-suave: #fff1e6;
    --bg: #f0f1f4; --surface: #fff; --line: #e6e8ec; --text: #1c1f24; --muted: #8a8f98;
    --mark: #ffd8b0; --raio: 16px;
  }
  /* tema escuro: segue o Windows, a menos que a pessoa escolha no botão do topo */
  @media (prefers-color-scheme: dark) {
    :root:not([data-tema="claro"]) {
      --topo: #9a3a0a; --destaque: #b8561c; --laranja: #ff8a3d; --laranja-suave: #3a2416;
      --bg: #15171b; --surface: #1f2228; --line: #2c3038; --text: #ebedf0; --muted: #9298a3;
      --mark: #7a4519;
    }
  }
  :root[data-tema="escuro"] {
    --topo: #9a3a0a; --destaque: #b8561c; --laranja: #ff8a3d; --laranja-suave: #3a2416;
    --bg: #15171b; --surface: #1f2228; --line: #2c3038; --text: #ebedf0; --muted: #9298a3;
    --mark: #7a4519;
  }
  .lua { display: none; }
  :root[data-tema="claro"] .sol, :root[data-tema="claro"] .lua { display: none; }
  :root[data-tema="claro"] .lua { display: block; }
  :root[data-tema="escuro"] .sol { display: block; }
  @media (prefers-color-scheme: dark) { :root:not([data-tema]) .sol { display: block; } }
  @media (prefers-color-scheme: light) { :root:not([data-tema]) .sol { display: none; } :root:not([data-tema]) .lua { display: block; } }
  * { box-sizing: border-box; }
  body { margin: 0; background: var(--bg); color: var(--text); font: 15px/1.5 Poppins, system-ui, "Segoe UI", sans-serif; }
  button { font: inherit; color: inherit; cursor: pointer; }
  mark { background: var(--mark); color: inherit; border-radius: 3px; padding: 0 1px; }
  .wrap { max-width: 980px; margin: 0 auto; padding: 0 20px; }

  /* barra do topo */
  .barra { background: var(--topo); color: #fff; }
  .barra .wrap { height: 70px; display: flex; align-items: center; justify-content: space-between; }
  .barra h1 { font-size: 21px; font-weight: 600; margin: 0; letter-spacing: -.2px; }
  .barra button { border: 0; background: none; color: #fff; padding: 8px; border-radius: 10px; display: flex; }
  .barra button:hover { background: rgba(255,255,255,.15); }
  .acoes { display: flex; gap: 4px; }

  main { padding: 20px 0 60px; }

  /* faixa de destaque com a busca */
  .faixa { background: var(--destaque); border-radius: var(--raio); padding: 18px 22px; display: flex; align-items: center; gap: 18px; color: #fff; }
  .faixa .ico { flex: none; width: 44px; height: 44px; border-radius: 12px; background: rgba(255,255,255,.2); display: grid; place-items: center; }
  .faixa .txt { font-weight: 600; font-size: 15px; white-space: nowrap; }
  .busca { flex: 1; position: relative; }
  .busca input { width: 100%; border: 0; border-radius: 12px; padding: 12px 40px 12px 16px; font: inherit; font-size: 15px; background: var(--surface); color: var(--text); outline: none; }
  .busca input:focus { box-shadow: 0 0 0 3px rgba(255,255,255,.55); }
  .busca .limpar { position: absolute; right: 6px; top: 50%; transform: translateY(-50%); border: 0; background: none; color: var(--muted); font-size: 22px; line-height: 1; padding: 4px 8px; display: none; }

  /* cards de resumo */
  .cards { display: grid; grid-template-columns: repeat(3, 1fr); gap: 16px; margin-top: 18px; }
  .card { background: var(--surface); border: 2px solid transparent; border-radius: var(--raio); padding: 20px 24px; text-align: left; }
  button.card:hover { border-color: var(--laranja-suave); }
  .card.ativo { border-color: var(--laranja); }
  .card .rot { font-weight: 500; font-size: 15.5px; }
  .card .valor { font-weight: 600; font-size: 19px; margin-top: 12px; }
  .card .sub { color: var(--muted); font-size: 13px; }

  /* atalhos de módulo */
  .atalhos { display: flex; flex-wrap: wrap; gap: 6px 4px; margin: 22px 0 8px; }
  .atalho { border: 0; background: none; width: 100px; display: flex; flex-direction: column; align-items: center; gap: 10px; padding: 0 0 6px; position: relative; }
  .atalho .q { width: 80px; height: 80px; border-radius: var(--raio); background: var(--surface); display: grid; place-items: center; color: var(--laranja); transition: transform .12s; }
  .atalho:hover .q { transform: translateY(-2px); }
  .atalho.ativo .q { background: var(--laranja); color: #fff; }
  .atalho .nome { font-size: 14.5px; }
  .atalho.ativo .nome { color: var(--laranja); font-weight: 500; }
  .atalho .n { position: absolute; top: -6px; right: 8px; background: var(--topo); color: #fff; font-size: 11px; font-weight: 600; min-width: 22px; height: 22px; padding: 0 6px; border-radius: 11px; display: grid; place-items: center; }
  .atalho.vazio { opacity: .35; }

  /* listas */
  .secao { margin-top: 26px; }
  .secao h2 { font-size: 16.5px; font-weight: 600; margin: 0; }
  .secao .desc { color: var(--muted); font-size: 13px; margin: 0 0 12px; }
  .lista { display: grid; grid-template-columns: repeat(2, 1fr); gap: 10px; }
  .item { background: var(--surface); border: 0; border-radius: 12px; padding: 13px 16px; text-align: left; display: flex; align-items: center; gap: 12px; }
  .item:hover { box-shadow: 0 0 0 2px var(--laranja-suave); }
  .item .play { flex: none; width: 34px; height: 34px; border-radius: 10px; background: var(--laranja-suave); color: var(--laranja); display: grid; place-items: center; }
  .item .t { font-weight: 500; font-size: 14px; line-height: 1.35; }
  .meta { display: flex; gap: 6px; flex-wrap: wrap; align-items: center; font-size: 12px; color: var(--muted); margin-top: 3px; }
  .tag { background: var(--bg); border-radius: 6px; padding: 1px 8px; font-size: 11.5px; color: var(--muted); }
  .tag.mod { background: var(--laranja-suave); color: var(--laranja); }

  .resultado { background: var(--surface); border-radius: var(--raio); padding: 18px 22px; margin-bottom: 12px; }
  .resultado .t { font-weight: 600; font-size: 15.5px; border: 0; background: none; padding: 0; text-align: left; }
  .resultado .t:hover { color: var(--laranja); }
  .trecho { display: flex; gap: 12px; margin-top: 10px; font-size: 14px; }
  .tempo { flex: none; border: 0; background: var(--laranja-suave); color: var(--laranja); font-weight: 500; border-radius: 8px; padding: 0 9px; font-size: 12.5px; font-variant-numeric: tabular-nums; height: 26px; }
  .tempo:hover { background: var(--laranja); color: #fff; }
  .mais { color: var(--muted); font-size: 12.5px; margin-top: 8px; }
  .vazio-msg { text-align: center; color: var(--muted); padding: 50px 0; background: var(--surface); border-radius: var(--raio); }

  /* vídeo aberto */
  dialog { border: 0; padding: 0; width: min(1040px, 100vw - 24px); max-height: calc(100vh - 24px); border-radius: 18px; background: var(--bg); color: var(--text); }
  dialog::backdrop { background: rgba(20,12,6,.55); }
  .dlg { display: flex; flex-direction: column; max-height: calc(100vh - 24px); }
  .dlg-topo { display: flex; gap: 12px; align-items: center; padding: 14px 20px; background: var(--topo); color: #fff; }
  .dlg-topo h3 { margin: 0; font-size: 16.5px; font-weight: 600; }
  .dlg-topo .meta .tag { background: rgba(255,255,255,.2); color: #fff; }
  .dlg-topo .fechar { margin-left: auto; border: 0; background: rgba(255,255,255,.18); color: #fff; border-radius: 10px; width: 36px; height: 36px; font-size: 20px; flex: none; }
  .dlg-corpo { display: grid; grid-template-columns: minmax(0, 1.15fr) minmax(0, 1fr); gap: 16px; padding: 16px; min-height: 0; flex: 1; }
  .player { background: var(--surface); border-radius: var(--raio); padding: 14px; align-self: start; }
  .player iframe { width: 100%; aspect-ratio: 16 / 9; border: 0; border-radius: 10px; background: #000; display: block; }
  .player a { display: inline-block; margin-top: 10px; color: var(--laranja); font-size: 13.5px; font-weight: 500; }
  .player input { width: 100%; margin-top: 12px; padding: 10px 12px; border: 1px solid var(--line); border-radius: 10px; background: var(--bg); color: var(--text); font: inherit; font-size: 14px; outline: none; }
  .player input:focus { border-color: var(--laranja); }
  .aviso { font-size: 12px; color: var(--muted); margin: 10px 0 0; }
  .transcricao { background: var(--surface); border-radius: var(--raio); overflow: auto; padding: 8px; max-height: calc(100vh - 120px); }
  .bloco { display: flex; gap: 12px; padding: 9px 8px; border-radius: 10px; font-size: 14px; }
  .bloco.foco { background: var(--laranja-suave); }
  .bloco.oculto { display: none; }

  @media (max-width: 820px) {
    .faixa { flex-wrap: wrap; }
    .faixa .txt { white-space: normal; }
    .busca { flex-basis: 100%; }
    .cards { grid-template-columns: 1fr; }
    .lista { grid-template-columns: 1fr; }
    .dlg-corpo { grid-template-columns: 1fr; overflow: auto; }
    .transcricao { max-height: none; overflow: visible; }
    .wrap { padding: 0 16px; }
    .atalho { width: 25%; min-width: 76px; }
    .atalho .q { width: 64px; height: 64px; }
    .atalho .nome { font-size: 13px; }
  }
</style>
</head>
<body>
<div class="barra">
  <div class="wrap">
    <h1>Consulta Link PRO</h1>
    <div class="acoes">
      <button id="tema" title="Alternar fundo claro / escuro">
        <svg class="sol" width="24" height="24" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round"><circle cx="12" cy="12" r="4"/><path d="M12 2v2M12 20v2M4.9 4.9l1.4 1.4M17.7 17.7l1.4 1.4M2 12h2M20 12h2M4.9 19.1l1.4-1.4M17.7 6.3l1.4-1.4"/></svg>
        <svg class="lua" width="24" height="24" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"><path d="M21 12.8A9 9 0 1 1 11.2 3a7 7 0 0 0 9.8 9.8z"/></svg>
      </button>
      <button id="recarregar" title="Recarregar a pasta Link_PRO">
        <svg width="24" height="24" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"><path d="M21 12a9 9 0 1 1-2.64-6.36L21 8"/><path d="M21 3v5h-5"/></svg>
      </button>
    </div>
  </div>
</div>

<main class="wrap">
  <section class="faixa">
    <span class="ico"><svg width="24" height="24" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2.2" stroke-linecap="round"><circle cx="11" cy="11" r="7"/><path d="m20 20-4-4"/></svg></span>
    <span class="txt">O que você precisa encontrar?</span>
    <div class="busca">
      <input id="q" type="text" placeholder="Ex.: sangria, certificado digital, iFood, nota de entrada…" autocomplete="off">
      <button class="limpar" id="limpar" title="Limpar">×</button>
    </div>
  </section>

  <section class="cards" id="cards"></section>
  <nav class="atalhos" id="atalhos"></nav>
  <div id="conteudo"></div>
</main>

<dialog id="dlg">
  <div class="dlg">
    <div class="dlg-topo">
      <div>
        <h3 id="dlg-titulo"></h3>
        <div class="meta" id="dlg-meta"></div>
      </div>
      <button class="fechar" id="fechar" title="Fechar (Esc)">×</button>
    </div>
    <div class="dlg-corpo">
      <div class="player">
        <iframe id="iframe" allow="autoplay; encrypted-media; picture-in-picture" allowfullscreen referrerpolicy="strict-origin-when-cross-origin"></iframe>
        <a id="yt" target="_blank" rel="noopener">Abrir no YouTube ↗</a>
        <input id="q-local" type="text" placeholder="Filtrar dentro deste vídeo…">
        <p class="aviso">Texto da legenda automática do YouTube: pode ter erros de digitação. Clique na minutagem para ir direto ao trecho.</p>
      </div>
      <div class="transcricao" id="transcricao"></div>
    </div>
  </div>
</dialog>

<script>
const $ = (s) => document.querySelector(s);
const svg = (d) => `<svg width="30" height="30" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.9" stroke-linecap="round" stroke-linejoin="round">${d}</svg>`;
// Atalhos de módulo: ordem, nome curto e ícone de cada um.
const ATALHOS = [
  ["", "Todos", svg('<rect x="3" y="3" width="7" height="7" rx="1.5"/><rect x="14" y="3" width="7" height="7" rx="1.5"/><rect x="3" y="14" width="7" height="7" rx="1.5"/><rect x="14" y="14" width="7" height="7" rx="1.5"/>')],
  ["vendas", "Caixa", svg('<path d="m5 11 3-6M19 11l-3-6"/><path d="M3 11h18l-1.6 7.2A2 2 0 0 1 17.4 20H6.6a2 2 0 0 1-2-1.8z"/><circle cx="12" cy="15" r="1.3"/>')],
  ["restaurante", "Delivery", svg('<circle cx="6" cy="17" r="3"/><circle cx="18" cy="17" r="3"/><path d="M9 17h6l-2-7h-3M13 10l2-4h3M15 6l3 11"/>')],
  ["estoque", "Estoque", svg('<rect x="3" y="4" width="18" height="5" rx="1.5"/><path d="M5 9v9a2 2 0 0 0 2 2h10a2 2 0 0 0 2-2V9M10 13h4"/>')],
  ["produtos", "Produtos", svg('<rect x="3" y="3" width="7" height="7" rx="1.5"/><path d="m17.5 2.5 4 4-4 4-4-4z"/><rect x="3" y="14" width="7" height="7" rx="1.5"/><rect x="14" y="14" width="7" height="7" rx="1.5"/>')],
  ["fiscal", "Fiscal", svg('<path d="M6 2h9l4 4v16l-3-2-2 2-2-2-2 2-2-2-2 2z"/><path d="M9 9h6M9 13h6M14 2v4h5"/>')],
  ["financeiro", "Financeiro", svg('<rect x="2" y="6" width="20" height="13" rx="2"/><path d="M2 10h20M6 15h4"/>')],
  ["equipamentos", "Etiquetas", svg('<path d="M3 12V4a1 1 0 0 1 1-1h8l9 9-9 9z"/><circle cx="7.5" cy="7.5" r="1.5"/>')],
  ["sistema", "Config", svg('<circle cx="12" cy="12" r="3"/><path d="M19.4 15a1.7 1.7 0 0 0 .3 1.8l.1.1a2 2 0 1 1-2.8 2.8l-.1-.1a1.7 1.7 0 0 0-1.8-.3 1.7 1.7 0 0 0-1 1.5V21a2 2 0 1 1-4 0v-.1a1.7 1.7 0 0 0-1.1-1.5 1.7 1.7 0 0 0-1.8.3l-.1.1a2 2 0 1 1-2.8-2.8l.1-.1a1.7 1.7 0 0 0 .3-1.8 1.7 1.7 0 0 0-1.5-1H3a2 2 0 1 1 0-4h.1a1.7 1.7 0 0 0 1.5-1.1 1.7 1.7 0 0 0-.3-1.8l-.1-.1a2 2 0 1 1 2.8-2.8l.1.1a1.7 1.7 0 0 0 1.8.3H9a1.7 1.7 0 0 0 1-1.5V3a2 2 0 1 1 4 0v.1a1.7 1.7 0 0 0 1 1.5 1.7 1.7 0 0 0 1.8-.3l.1-.1a2 2 0 1 1 2.8 2.8l-.1.1a1.7 1.7 0 0 0-.3 1.8V9a1.7 1.7 0 0 0 1.5 1H21a2 2 0 1 1 0 4h-.1a1.7 1.7 0 0 0-1.5 1z"/>')],
];
const TIPOS = [
  ["Tutorial", "Tutoriais", "vídeos curtos de passo a passo"],
  ["Treinamento", "Treinamentos", "aulas completas por assunto"],
  ["Cadastro de Produtos", "Cadastro de Produtos", "série sobre o cadastro"],
];
const PLAY = '<svg width="16" height="16" viewBox="0 0 24 24" fill="currentColor"><path d="M8 5.5v13a1 1 0 0 0 1.5.9l10.2-6.5a1 1 0 0 0 0-1.8L9.5 4.6A1 1 0 0 0 8 5.5z"/></svg>';
const PARADAS = new Set("a o e de da do das dos um uma no na nos nas em para por com como que se ao os as".split(" "));
const estado = { modulo: "", tipo: "", q: "" };
let dados = { modulos: [], videos: [] };

const norm = (s) => s.normalize("NFD").replace(/[̀-ͯ]/g, "").toLowerCase();
const esc = (s) => s.replace(/[&<>"]/g, (c) => ({ "&": "&amp;", "<": "&lt;", ">": "&gt;", '"': "&quot;" }[c]));
const fmt = (n) => n.toLocaleString("pt-BR");

function termos(q) {
  const t = norm(q).split(/[^\p{L}\p{N}-]+/u).filter((x) => x && !PARADAS.has(x));
  return [...new Set(t)];
}

// Destaca os termos sem perder os acentos do texto original.
function destacar(texto, ts) {
  if (!ts.length) return esc(texto);
  const chars = [...texto];
  const n = chars.map((c) => norm(c)[0] || " ").join("");
  const marca = new Array(chars.length).fill(false);
  for (const t of ts) {
    let i = n.indexOf(t);
    while (i !== -1) { for (let k = i; k < i + t.length; k++) marca[k] = true; i = n.indexOf(t, i + 1); }
  }
  let out = "", dentro = false;
  chars.forEach((c, i) => {
    if (marca[i] && !dentro) { out += "<mark>"; dentro = true; }
    if (!marca[i] && dentro) { out += "</mark>"; dentro = false; }
    out += esc(c);
  });
  return out + (dentro ? "</mark>" : "");
}

// Recorta um trecho em volta do primeiro termo encontrado.
function recorte(texto, ts, tam = 230) {
  if (texto.length <= tam) return texto;
  const n = norm(texto);
  const pos = Math.min(...ts.map((t) => n.indexOf(t)).filter((i) => i >= 0), Infinity);
  let ini = pos === Infinity ? 0 : Math.max(0, pos - 70);
  if (ini > 0) ini = texto.indexOf(" ", ini) + 1;
  let fim = Math.min(texto.length, ini + tam);
  if (fim < texto.length) fim = texto.lastIndexOf(" ", fim);
  return (ini > 0 ? "… " : "") + texto.slice(ini, fim) + (fim < texto.length ? " …" : "");
}

function preparar() {
  for (const v of dados.videos) {
    v._titulo = norm(v.titulo + " " + v.tituloOriginal);
    v._blocos = v.blocos.map((b) => norm(b.texto));
    v._tudo = v._titulo + " " + v._blocos.join(" ");
  }
}

function buscar(ts) {
  const res = [];
  for (const v of dados.videos) {
    if (!ts.every((t) => v._tudo.includes(t))) continue;
    const noTitulo = ts.filter((t) => v._titulo.includes(t)).length;
    const blocos = [];
    v._blocos.forEach((b, i) => {
      const acertos = ts.filter((t) => b.includes(t)).length;
      if (acertos) blocos.push({ i, acertos });
    });
    blocos.sort((a, b) => b.acertos - a.acertos || a.i - b.i);
    const pontos = noTitulo * 20 + blocos.reduce((s, b) => s + b.acertos * b.acertos, 0);
    res.push({ v, blocos, pontos });
  }
  return res.sort((a, b) => b.pontos - a.pontos);
}

const nomeModulo = (id) => (dados.modulos.find((m) => m.id === id) || {}).nome || id;
const passa = (v, ignorar) =>
  (ignorar === "modulo" || !estado.modulo || v.modulo === estado.modulo) &&
  (ignorar === "tipo" || !estado.tipo || v.tipos.includes(estado.tipo));

// Cards de resumo = filtro por tipo; atalhos = filtro por módulo. Contagens respeitam a busca e o outro filtro.
function desenharFiltros(base) {
  $("#cards").innerHTML = TIPOS.map(([tipo, rot, sub]) => {
    const n = base.filter((v) => v.tipos.includes(tipo) && passa(v, "tipo")).length;
    return `<button class="card ${estado.tipo === tipo ? "ativo" : ""}" data-tipo="${esc(tipo)}">
      <div class="rot">${rot}</div>
      <div class="valor">${fmt(n)} ${n === 1 ? "vídeo" : "vídeos"}</div>
      <div class="sub">${estado.tipo === tipo ? "Filtro ativo · clique para remover" : sub}</div>
    </button>`;
  }).join("");
  $("#atalhos").innerHTML = ATALHOS.map(([id, nome, icone]) => {
    const n = base.filter((v) => (!id || v.modulo === id) && passa(v, "modulo")).length;
    const ativo = estado.modulo === id;
    return `<button class="atalho ${ativo ? "ativo" : ""} ${!n && !ativo ? "vazio" : ""}" data-modulo="${id}" title="${esc(id ? nomeModulo(id) : "Todos os módulos")}">
      <span class="q">${icone}</span><span class="n">${n}</span><span class="nome">${nome}</span>
    </button>`;
  }).join("");
}

function itemVideo(v) {
  return `<button class="item" data-video="${v.id}">
    <span class="play">${PLAY}</span>
    <span><span class="t">${esc(v.titulo)}</span>
    <span class="meta">${v.tipos.map((t) => `<span class="tag">${esc(t)}</span>`).join("")}</span></span>
  </button>`;
}

function desenhar() {
  const ts = termos(estado.q);
  $("#limpar").style.display = estado.q ? "block" : "none";
  const el = $("#conteudo");

  if (!ts.length) {
    desenharFiltros(dados.videos);
    const visiveis = dados.videos.filter((v) => passa(v));
    let h = "";
    for (const [id] of ATALHOS.slice(1)) {
      const m = dados.modulos.find((x) => x.id === id);
      const vs = visiveis.filter((v) => v.modulo === id);
      if (!m || !vs.length) continue;
      h += `<section class="secao"><h2>${esc(m.nome)}</h2><p class="desc">${vs.length} ${vs.length === 1 ? "vídeo" : "vídeos"} · ${esc(m.descricao)}</p><div class="lista">${vs.map(itemVideo).join("")}</div></section>`;
    }
    el.innerHTML = h || `<div class="secao"><p class="vazio-msg">Nenhum vídeo com esses filtros.</p></div>`;
    return;
  }

  const todos = buscar(ts);
  desenharFiltros(todos.map((r) => r.v));
  const res = todos.filter((r) => passa(r.v));
  let h = `<section class="secao"><h2>${res.length} ${res.length === 1 ? "vídeo encontrado" : "vídeos encontrados"} para “${esc(estado.q.trim())}”</h2><p class="desc">${estado.modulo ? "No módulo " + esc(nomeModulo(estado.modulo)) + ". " : ""}Clique na minutagem para abrir o vídeo no trecho.</p>`;
  if (!res.length) {
    el.innerHTML = h + `<p class="vazio-msg">Nada encontrado. Tente outra palavra ou menos termos.</p></section>`;
    return;
  }
  h += res.slice(0, 80).map(({ v, blocos }) => {
    const trechos = blocos.slice(0, 3).map(({ i }) => {
      const b = v.blocos[i];
      return `<div class="trecho"><button class="tempo" data-video="${v.id}" data-seg="${b.seg}">${b.tempo}</button><span>${destacar(recorte(b.texto, ts), ts)}</span></div>`;
    }).join("");
    const resto = blocos.length > 3 ? `<div class="mais">+ ${blocos.length - 3} trecho(s) neste vídeo</div>` : "";
    return `<article class="resultado">
      <button class="t" data-video="${v.id}">${destacar(v.titulo, ts)}</button>
      <div class="meta"><span class="tag mod">${esc(nomeModulo(v.modulo))}</span>${v.tipos.map((t) => `<span class="tag">${esc(t)}</span>`).join("")}</div>
      ${trechos}${resto}
    </article>`;
  }).join("");
  el.innerHTML = h + "</section>";
}

// ---------- vídeo aberto
let atual = null;
function abrir(id, seg) {
  const v = dados.videos.find((x) => x.id === id);
  if (!v) return;
  atual = v;
  $("#dlg-titulo").textContent = v.titulo;
  $("#dlg-meta").innerHTML = `<span class="tag">${esc(nomeModulo(v.modulo))}</span>` + v.tipos.map((t) => `<span class="tag">${esc(t)}</span>`).join("");
  $("#yt").href = v.url;
  $("#q-local").value = "";
  tocar(seg || 0, seg != null);
  desenharTranscricao(termos(estado.q));
  if (!$("#dlg").open) $("#dlg").showModal();
  marcarBloco(seg);
}

function tocar(seg, auto) {
  $("#iframe").src = `https://www.youtube-nocookie.com/embed/${atual.id}?start=${Math.floor(seg)}&rel=0${auto ? "&autoplay=1" : ""}`;
}

function desenharTranscricao(ts) {
  $("#transcricao").innerHTML = atual.blocos.map((b, i) =>
    `<div class="bloco" data-i="${i}"><button class="tempo" data-seg="${b.seg}">${b.tempo}</button><span>${destacar(b.texto, ts)}</span></div>`
  ).join("") || `<p class="vazio-msg">Vídeo sem legenda.</p>`;
}

function marcarBloco(seg) {
  document.querySelectorAll(".bloco.foco").forEach((b) => b.classList.remove("foco"));
  if (seg == null) return $("#transcricao").scrollTo(0, 0);
  const i = atual.blocos.findIndex((b) => b.seg === Number(seg));
  const el = document.querySelector(`.bloco[data-i="${i}"]`);
  if (el) { el.classList.add("foco"); el.scrollIntoView({ block: "center" }); }
}

// ---------- eventos
let timer;
$("#q").addEventListener("input", (e) => {
  clearTimeout(timer);
  timer = setTimeout(() => { estado.q = e.target.value; desenhar(); }, 120);
});
$("#limpar").addEventListener("click", () => { $("#q").value = ""; estado.q = ""; desenhar(); $("#q").focus(); });
$("#cards").addEventListener("click", (e) => {
  const b = e.target.closest("[data-tipo]");
  if (b) { estado.tipo = estado.tipo === b.dataset.tipo ? "" : b.dataset.tipo; desenhar(); }
});
$("#atalhos").addEventListener("click", (e) => {
  const b = e.target.closest("[data-modulo]");
  if (b) { estado.modulo = estado.modulo === b.dataset.modulo ? "" : b.dataset.modulo; desenhar(); }
});
$("#conteudo").addEventListener("click", (e) => {
  const b = e.target.closest("[data-video]");
  if (b) abrir(b.dataset.video, b.dataset.seg != null ? Number(b.dataset.seg) : undefined);
});
$("#transcricao").addEventListener("click", (e) => {
  const b = e.target.closest(".tempo");
  if (!b) return;
  tocar(Number(b.dataset.seg), true);
  marcarBloco(Number(b.dataset.seg));
});
$("#q-local").addEventListener("input", (e) => {
  const ts = termos(e.target.value);
  desenharTranscricao(ts.length ? ts : termos(estado.q));
  if (ts.length) document.querySelectorAll(".bloco").forEach((el) => {
    el.classList.toggle("oculto", !ts.every((t) => atual._blocos[el.dataset.i].includes(t)));
  });
});
$("#fechar").addEventListener("click", () => $("#dlg").close());
$("#dlg").addEventListener("click", (e) => { if (e.target === $("#dlg")) $("#dlg").close(); });
$("#dlg").addEventListener("close", () => { $("#iframe").src = "about:blank"; });
$("#recarregar").addEventListener("click", carregar);
$("#tema").addEventListener("click", () => {
  const atualEscuro = getComputedStyle(document.documentElement).getPropertyValue("--bg").trim() === "#15171b";
  const novo = atualEscuro ? "claro" : "escuro";
  document.documentElement.dataset.tema = novo;
  try { localStorage.setItem("tema", novo); } catch (e) {}
});
document.addEventListener("keydown", (e) => {
  if (e.key === "/" && document.activeElement.tagName !== "INPUT") { e.preventDefault(); $("#q").focus(); }
});

function carregar() {
  fetch("conteudo.json", { cache: "no-store" })
    .then((r) => (r.ok ? r.json() : r.text().then((t) => Promise.reject(new Error(t)))))
    .then((d) => { dados = d; preparar(); desenhar(); })
    .catch((e) => { $("#conteudo").innerHTML = `<div class="secao"><p class="vazio-msg">Não consegui ler as transcrições.<br>${esc(e.message)}</p></div>`; });
}
carregar();
</script>
</body>
